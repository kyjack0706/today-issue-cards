<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오늘의 화제 이슈</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='80'%3E%F0%9F%93%B0%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --bg:#141413; --bg2:#1b1a18; --ink:#faf9f5; --sub:#b9b6ae; --mute:#6b6960;
    --line:#2a2924; --accent:#d97757; --shadow:0 0 0 rgba(0,0,0,0);
    --tech:#5b8def; --ent:#f06595; --biz:#2f9e64; --soc:#f2994a; --sport:#71d7e4; --culture:#b58cff;
    --new:#ff6b57; --new-ink:#1a1310; --tab-ink:#1a1310;
  }
  html[data-theme="light"]{
    --bg:#faf9f5; --bg2:#ffffff; --ink:#1f1e1c; --sub:#5c594f; --mute:#9a968a;
    --line:#e6e2d8; --accent:#c9603f; --shadow:0 1px 2px rgba(0,0,0,0.03);
    --tech:#2f6fd6; --ent:#d1497a; --biz:#1f8a53; --soc:#d9822b; --sport:#1798a8; --culture:#8256d6;
    --new:#c9402c; --new-ink:#fff; --tab-ink:#fff;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;transition:background .15s,color .15s;}
  .wrap{max-width:760px;margin:0 auto;padding:28px 20px 80px;}
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;gap:10px;}
  .brand{font-size:15px;letter-spacing:0.14em;color:var(--accent);font-weight:800;}
  .status-row{margin-bottom:20px;}
  .status{font-size:12px;color:var(--mute);display:flex;align-items:center;gap:6px;}
  .dot{width:7px;height:7px;border-radius:99px;background:#3fb950;box-shadow:0 0 0 3px rgba(63,185,80,0.18);}
  .dot.off{background:var(--mute);box-shadow:none;}
  .theme-toggle{display:flex;gap:3px;background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:3px;box-shadow:var(--shadow);}
  .theme-btn{border:none;background:transparent;color:var(--mute);font-size:12px;font-weight:700;padding:7px 12px;border-radius:999px;cursor:pointer;display:flex;align-items:center;gap:5px;white-space:nowrap;}
  .theme-btn.active{background:var(--accent);color:var(--tab-ink);}

  .search-bar{margin-bottom:12px;}
  .search-bar input{width:100%;background:var(--bg2);border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:12px 16px;font-size:14px;font-family:inherit;box-shadow:var(--shadow);}
  .search-bar input::placeholder{color:var(--mute);}

  .tabs{display:flex;gap:6px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:16px;flex-wrap:wrap;box-shadow:var(--shadow);}
  .tab{flex:1;min-width:58px;text-align:center;padding:10px 6px;border-radius:9px;font-size:13px;font-weight:700;color:var(--sub);cursor:pointer;user-select:none;border:none;background:transparent;}
  .tab.active{background:var(--accent);color:var(--tab-ink);}

  .panel{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:20px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;box-shadow:var(--shadow);}
  .panel input, .panel select{
    background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:8px;
    padding:9px 12px;font-size:14px;font-family:inherit;flex:1;min-width:140px;
  }
  .panel .hint{font-size:12px;color:var(--mute);width:100%;}
  .chips{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{padding:7px 14px;border-radius:999px;font-size:13px;border:1px solid var(--line);background:var(--bg);color:var(--sub);cursor:pointer;}
  .chip.active{border-color:var(--accent);color:var(--accent);background:rgba(217,119,87,0.1);}

  .count{font-size:13px;color:var(--mute);margin:0 2px 12px;}
  .new-count{color:var(--new);font-weight:800;}
  .new-badge{background:var(--new);color:var(--new-ink);font-size:10px;font-weight:900;letter-spacing:0.04em;padding:3px 7px;border-radius:5px;}

  .card{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin-bottom:14px;display:block;text-decoration:none;color:inherit;transition:border-color .15s, box-shadow .15s;box-shadow:var(--shadow);}
  a.card{cursor:pointer;}
  a.card:hover{border-color:var(--accent);}
  .link-hint{color:var(--accent);font-weight:700;}
  .card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
  .tag{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:5px 13px;font-size:12px;font-weight:800;}
  .tag .d{width:6px;height:6px;border-radius:99px;}
  .time{font-size:12px;color:var(--mute);}
  .title{font-size:19px;font-weight:800;line-height:1.4;margin:0 0 8px;letter-spacing:-0.01em;}
  .summary{font-size:14.5px;color:var(--sub);line-height:1.6;margin:0 0 12px;}
  .card-bottom{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--mute);border-top:1px solid var(--line);padding-top:10px;}

  .empty{text-align:center;color:var(--mute);font-size:14px;padding:60px 20px;}
  .empty b{color:var(--sub);}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">ISSUE PICK</div>
    <div class="theme-toggle">
      <button class="theme-btn" id="btnDark" title="어두운 배경">🌙 어두운</button>
      <button class="theme-btn" id="btnLight" title="밝은 배경">☀️ 밝은</button>
    </div>
  </header>
  <div class="status-row">
    <div class="status"><span class="dot off" id="liveDot"></span><span id="liveText">연결 중…</span></div>
  </div>

  <div class="search-bar">
    <input id="globalSearch" type="text" placeholder="🔍 제목·키워드로 검색 (예: 아이폰, 손예진, 부동산...)">
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="live">실시간</button>
    <button class="tab" data-tab="hour">시간별</button>
    <button class="tab" data-tab="cat">카테고리</button>
    <button class="tab" data-tab="date">날짜</button>
  </div>

  <div class="panel" id="panel-live">
    <span class="hint">최신순으로 전체 이슈를 보여줘요. 1분마다 자동으로 새로고침됩니다.</span>
  </div>

  <div class="panel" id="panel-hour" style="display:none;">
    <select id="hourSelect">
      <option value="">전체 시간</option>
    </select>
    <span class="hint">시간대를 고르면 그 시간대에 올라온 이슈만 보여줘요 (최근 7일 기준).</span>
  </div>

  <div class="panel" id="panel-cat" style="display:none;">
    <div class="chips" id="catChips"></div>
    <span class="hint">카테고리를 클릭해서 필터링하거나, 위 검색창을 사용하세요.</span>
  </div>

  <div class="panel" id="panel-date" style="display:none;">
    <input id="dateSelect" type="date">
    <span class="hint" id="dateHint">최근 7일 중에서 날짜를 골라주세요.</span>
  </div>

  <div class="count" id="countText"></div>
  <div id="list"></div>
</div>

<script>
(function(){
  // ---- theme ----
  const root = document.documentElement;
  const btnDark = document.getElementById('btnDark');
  const btnLight = document.getElementById('btnLight');
  function applyTheme(t){
    if(t === 'light'){ root.setAttribute('data-theme','light'); }
    else { root.removeAttribute('data-theme'); }
    btnDark.classList.toggle('active', t !== 'light');
    btnLight.classList.toggle('active', t === 'light');
    try{ localStorage.setItem('theme', t); }catch(e){}
  }
  let savedTheme = 'dark';
  try{ savedTheme = localStorage.getItem('theme') || 'dark'; }catch(e){}
  applyTheme(savedTheme);
  btnDark.addEventListener('click', ()=>applyTheme('dark'));
  btnLight.addEventListener('click', ()=>applyTheme('light'));

  const KST_OFFSET_MIN = 9 * 60;
  function toKST(d){ return new Date(d.getTime() + (KST_OFFSET_MIN + d.getTimezoneOffset()) * 60000); }
  function dateStrKST(d){
    const k = toKST(d);
    return k.getFullYear() + '-' + String(k.getMonth()+1).padStart(2,'0') + '-' + String(k.getDate()).padStart(2,'0');
  }
  function hourKST(d){ return toKST(d).getHours(); }
  function fmtTime(d){
    const k = toKST(d);
    const hh = String(k.getHours()).padStart(2,'0');
    const mm = String(k.getMinutes()).padStart(2,'0');
    return dateStrKST(d) + ' ' + hh + ':' + mm;
  }

  const CATEGORY_META = {
    '기술': {color:'var(--tech)', bg:'rgba(91,141,239,0.12)', border:'rgba(91,141,239,0.4)'},
    '연예': {color:'var(--ent)', bg:'rgba(240,101,149,0.12)', border:'rgba(240,101,149,0.4)'},
    '경제': {color:'var(--biz)', bg:'rgba(47,158,100,0.12)', border:'rgba(47,158,100,0.4)'},
    '사회': {color:'var(--soc)', bg:'rgba(242,153,74,0.12)', border:'rgba(242,153,74,0.4)'},
    '스포츠': {color:'var(--sport)', bg:'rgba(113,215,228,0.12)', border:'rgba(113,215,228,0.4)'},
    '문화': {color:'var(--culture)', bg:'rgba(181,140,255,0.12)', border:'rgba(181,140,255,0.4)'},
  };
  function metaFor(cat){ return CATEGORY_META[cat] || {color:'var(--accent)', bg:'rgba(217,119,87,0.12)', border:'rgba(217,119,87,0.4)'}; }

  let allItems = [];
  let activeTab = 'live';
  let hourFilter = '';
  let catFilter = '';
  let dateFilter = '';

  const hourSelect = document.getElementById('hourSelect');
  for(let h=0; h<24; h++){
    const opt = document.createElement('option');
    opt.value = String(h);
    opt.textContent = String(h).padStart(2,'0') + '시대';
    hourSelect.appendChild(opt);
  }
  hourSelect.addEventListener('change', ()=>{ hourFilter = hourSelect.value; render(); });

  const globalSearch = document.getElementById('globalSearch');
  let searchQuery = '';
  globalSearch.addEventListener('input', ()=>{ searchQuery = globalSearch.value.trim(); render(); });

  const catChipsEl = document.getElementById('catChips');
  function renderCatChips(){
    const cats = Array.from(new Set(allItems.map(i=>i.category).filter(Boolean)));
    catChipsEl.innerHTML = '';
    cats.forEach(c=>{
      const b = document.createElement('button');
      b.className = 'chip' + (catFilter === c ? ' active' : '');
      b.textContent = c;
      b.onclick = ()=>{ catFilter = (catFilter === c) ? '' : c; render(); };
      catChipsEl.appendChild(b);
    });
  }

  const dateSelect = document.getElementById('dateSelect');
  const today = new Date();
  const maxD = dateStrKST(today);
  const minDate = new Date(today.getTime() - 6*86400000);
  const minD = dateStrKST(minDate);
  dateSelect.min = minD; dateSelect.max = maxD; dateSelect.value = maxD;
  dateFilter = maxD;
  document.getElementById('dateHint').textContent = minD + ' ~ ' + maxD + ' 사이에서 고를 수 있어요.';
  dateSelect.addEventListener('change', ()=>{ dateFilter = dateSelect.value; render(); });

  document.querySelectorAll('.tab').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      ['live','hour','cat','date'].forEach(t=>{
        document.getElementById('panel-'+t).style.display = (t === btn.dataset.tab) ? 'flex' : 'none';
      });
      activeTab = btn.dataset.tab;
      render();
    });
  });

  function render(){
    let items = allItems.slice();
    items.sort((a,b)=> new Date(b.ts) - new Date(a.ts));

    if(searchQuery){
      const q = searchQuery.toLowerCase();
      items = items.filter(i =>
        (i.category||'').toLowerCase().includes(q) ||
        (i.title||'').toLowerCase().includes(q) ||
        (i.summary||'').toLowerCase().includes(q)
      );
    }

    if(activeTab === 'hour' && hourFilter !== ''){
      items = items.filter(i => hourKST(new Date(i.ts)) === Number(hourFilter));
    } else if(activeTab === 'cat' && catFilter){
      items = items.filter(i => (i.category||'') === catFilter);
    } else if(activeTab === 'date' && dateFilter){
      items = items.filter(i => dateStrKST(new Date(i.ts)) === dateFilter);
    } else if(activeTab === 'live'){
      items = items.slice(0, 30);
    }

    const cutoff = today.getTime() - 7*86400000;
    items = items.filter(i => new Date(i.ts).getTime() >= cutoff);

    const NEW_WINDOW_MS = 60 * 60000;
    const nowMs = Date.now();
    const newCount = items.filter(i => (nowMs - new Date(i.ts).getTime()) <= NEW_WINDOW_MS).length;

    renderCatChips();
    document.getElementById('countText').innerHTML =
      '총 ' + items.length + '개 이슈' +
      (newCount > 0 ? ' <span class="new-count">· NEW ' + newCount + '개</span>' : '');

    const list = document.getElementById('list');
    if(items.length === 0){
      list.innerHTML = '<div class="empty">조건에 맞는 이슈가 없습니다.</div>';
      return;
    }

    list.innerHTML = items.map(i=>{
      const m = metaFor(i.category);
      const hasUrl = !!(i.url && /^https?:\/\//.test(i.url));
      const tag = hasUrl ? 'a' : 'div';
      const attrs = hasUrl ? ' href="'+ escapeHtml(i.url) +'" target="_blank" rel="noopener noreferrer"' : '';
      const isNew = (nowMs - new Date(i.ts).getTime()) <= NEW_WINDOW_MS;
      return '<'+tag+' class="card"'+attrs+'>'
        + '<div class="card-top">'
        +   '<div style="display:flex;align-items:center;gap:8px;">'
        +     '<span class="tag" style="background:'+m.bg+';border:1px solid '+m.border+';color:'+m.color+';">'
        +       '<span class="d" style="background:'+m.color+';"></span>'+ (i.category||'이슈')
        +     '</span>'
        +     (isNew ? '<span class="new-badge">NEW</span>' : '')
        +   '</div>'
        +   '<span class="time">'+ fmtTime(new Date(i.ts)) +'</span>'
        + '</div>'
        + '<div class="title">'+ escapeHtml(i.title||'') +'</div>'
        + '<div class="summary">'+ escapeHtml(i.summary||'') +'</div>'
        + '<div class="card-bottom">'
        +   '<span>출처 '+ escapeHtml(i.source||'-') +'</span>'
        +   '<span>'+ escapeHtml(i.tags||'') + (hasUrl ? ' <span class="link-hint">· 기사 보기 ↗</span>' : '') +'</span>'
        + '</div>'
      + '</'+tag+'>';
    }).join('');
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  const liveDot = document.getElementById('liveDot');
  const liveText = document.getElementById('liveText');

  function fmtHM(iso){
    const k = toKST(new Date(iso));
    return String(k.getHours()).padStart(2,'0') + ':' + String(k.getMinutes()).padStart(2,'0');
  }

  async function load(){
    try{
      const r = await fetch('/api/news');
      allItems = await r.json();
      let updatedLabel = '';
      try{
        const mr = await fetch('/api/meta');
        const meta = await mr.json();
        if(meta && meta.lastUpdated){ updatedLabel = ' · ' + fmtHM(meta.lastUpdated) + ' 업데이트'; }
      }catch(e){}
      liveDot.classList.remove('off');
      liveText.textContent = '연결됨 · ' + allItems.length + '건' + updatedLabel;
    }catch(e){
      liveDot.classList.add('off');
      liveText.textContent = '연결 오류';
    }
    render();
  }
  load();
  setInterval(load, 60000);
})();
</script>
</body>
</html>
